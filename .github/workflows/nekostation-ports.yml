name: NekoStation portable builds
on:
  push:
    branches: [nekostation]
    paths:
      - 'portable/**'
      - 'tools/**'
      - '*.js'
      - '*.html'
      - '*.css'
      - '.github/workflows/nekostation-ports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --prefix tools/desktop_deps --ignore-scripts
      - run: node tools/build_desktop.mjs darwin ${{ matrix.arch }}
      - run: python -m pip install playwright
      - name: Test the archived application on macOS
        run: |
          ditto -x -k dist/*.zip "$RUNNER_TEMP/nekostation-test"
          python tools/smoke_port.py --electron "$RUNNER_TEMP/nekostation-test/NekoStation.app/Contents/MacOS/NekoStation"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.zip
          compression-level: 0
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build an instrumentable copy for the emulator
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          python tools/build_android.py --debug-webview
          keytool -genkeypair -keyalg RSA -keystore "$RUNNER_TEMP/qa.jks" -alias test -storepass android -keypass android -dname CN=Test
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/qa.jks" --ks-pass pass:android dist/*debug.apk
          python -m pip install playwright
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/test_android.sh
